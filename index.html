<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4efdf"><title>Hver tengir?</title><style>:root{--paper:#f4efdf;--ink:#111;--red:#f04d3d;--blue:#4c78ff;--green:#bfe66a;--yellow:#ffd34e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(840px,100%);margin:auto;padding:18px 16px 34px}.brand{font-size:clamp(36px,10vw,74px);font-weight:1000;letter-spacing:-.07em;line-height:.9;margin:8px 0 18px}.gamepick,.modes,.controls{display:grid;gap:10px}.gamepick{grid-template-columns:1fr 1fr;margin-bottom:14px}.modes{grid-template-columns:1fr 1fr;margin-bottom:14px}button{border:2px solid #111;background:#fff;color:#111;border-radius:16px;padding:14px;font:inherit;font-weight:950;cursor:pointer;box-shadow:4px 4px 0 #111}.gamepick button.active{background:var(--blue);color:#fff}.modes button.active{background:var(--green)}.modes .drink.active{background:var(--red);color:#fff}.card{min-height:430px;background:#fff;border:3px solid #111;border-radius:26px;box-shadow:8px 8px 0 #111;padding:clamp(22px,6vw,46px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.card:after{content:"★";position:absolute;right:24px;top:18px;font-size:38px;color:var(--red);transform:rotate(12deg)}.eyebrow{font-size:13px;text-transform:uppercase;font-weight:1000;letter-spacing:.1em}.fact{font-size:clamp(38px,9vw,72px);font-weight:1000;letter-spacing:-.06em;line-height:.94;margin:28px 0;max-width:13ch}.sub{font-weight:750;line-height:1.45;max-width:58ch}.counter{margin-top:10px;font-size:13px;font-weight:900;color:#6a655c}.controls{grid-template-columns:1fr 1.6fr 1fr;margin-top:18px}.controls .next{background:var(--blue);color:#fff}.small{font-size:13px;color:#6a655c;line-height:1.45;margin-top:20px}.gate{display:none;position:fixed;inset:0;background:#111d;z-index:9;align-items:center;justify-content:center;padding:20px}.gate.show{display:flex}.gatebox{background:var(--paper);border:3px solid #111;border-radius:24px;max-width:480px;padding:26px;box-shadow:8px 8px 0 #000}.gatebox h2{font-size:36px;letter-spacing:-.05em;margin:0 0 8px}.gateactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yes{background:var(--red);color:#fff}@media(max-width:500px){.gamepick,.modes{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls .next{grid-column:1/-1;grid-row:1}.card{min-height:470px}}</style></head><body><div class="wrap"><div class="brand">HVER<br>TENGIR?</div><div class="gamepick"><button id="connectBtn" class="active">HVER TENGIR?</button><button id="neverBtn">ALDREI HEF ÉG</button></div><div class="modes"><button id="soberBtn" class="active">EDRÚ</button><button id="drinkBtn" class="drink">DRYKKIR · 18+</button></div><main class="card"><div><div class="eyebrow" id="eyebrow"></div><div class="fact" id="fact"></div></div><div><div class="sub" id="sub"></div><div class="counter" id="counter"></div></div></main><div class="controls"><button id="prev">← TIL BAKA</button><button id="next" class="next">NÆSTA →</button><button id="shuffle">↻ STOKKA</button></div><p class="small" id="small"></p></div><div class="gate" id="gate"><div class="gatebox"><h2>18+ hamur</h2><p>Sopi má alltaf vera vatn eða óáfengur drykkur. Engin pressa og alltaf í lagi að sleppa.</p><div class="gateactions"><button id="gateNo">Halda edrú</button><button class="yes" id="gateYes">Ég er 18+ →</button></div></div></div><script>const connect=["Ég mætti á Októberfest","Ég er tvítyngdur","Ég er yfir 180 cm","Ég er með tagl í hárinu","Ég er með gleraugu","Ég hef æft fótbolta","Ég er í hettupeysu","Ég á bíl","Ég er miðjubarn","Ég var í Skrekk","Ég á gæludýr","Ég er með naglalakk","Ég vinn í félagsmiðstöð","Ég æfi dans","Ég er skilnaðarbarn","Ég er einkabarn","Ég hef áður lært eitthvað annað í háskóla","Ég hef æft körfubolta","Ég elska kvikmyndir","Ég elska að föndra","Ég hef farið til annarrar heimsálfu","Ég er yfir þrítugt","Ég bý ein(n) og á íbúð","Ég hef aldrei farið erlendis","Ég kann á hljóðfæri","Ég kann táknmál","Ég á barn","Ég hef búið erlendis","Ég er í sambandi","Ég nota gleraugu eða linsur","Ég er með húðflúr","Ég elska ljósmyndun","Ég er ekki með bílpróf"];const neverSober=["Aldrei hef ég sofnað í tíma","Aldrei hef ég sent skilaboð á vitlausan einstakling","Aldrei hef ég logið um að vera á leiðinni","Aldrei hef ég sungið í sturtu","Aldrei hef ég horft á heila seríu á einum degi","Aldrei hef ég gleymt afmæli náins vinar","Aldrei hef ég farið í karaoke","Aldrei hef ég misst símann í klósett","Aldrei hef ég pantað mat bara fyrir eftirréttinn","Aldrei hef ég þóst skilja eitthvað sem ég skildi ekki","Aldrei hef ég grátið yfir kvikmynd","Aldrei hef ég hitt fræga manneskju","Aldrei hef ég farið í klippingu sem ég sá strax eftir","Aldrei hef ég dansað þegar enginn sá til","Aldrei hef ég verið vakandi alla nóttina","Aldrei hef ég farið á Tinder-deit","Aldrei hef ég átt barn","Aldrei hef ég farið solo til útlanda","Aldrei hef ég farið á Þjóðhátíð","Aldrei hef ég borðað morgunmat í kvöldmat","Aldrei hef ég villst í útlöndum"];const neverDrink=["Aldrei hef ég sent fyrrverandi skilaboð eftir miðnætti","Aldrei hef ég daðrað til að fá frían drykk","Aldrei hef ég gleymt hluta úr kvöldi","Aldrei hef ég farið í blackout","Aldrei hef ég tekið Irish exit í partýi","Aldrei hef ég dansað uppi á borði","Aldrei hef ég logið um hversu marga drykki ég fékk mér","Aldrei hef ég vaknað með mat sem ég man ekki eftir að hafa keypt","Aldrei hef ég kysst einhvern sem ég hitti sama kvöld","Aldrei hef ég sungið karaoke í partýi","Aldrei hef ég farið á djammið kvöldið fyrir mikilvægan dag","Aldrei hef ég mætt þunnur í vinnuna","Aldrei hef ég týnt jakka á djamminu","Aldrei hef ég þurft að afsaka skilaboð frá kvöldinu áður","Aldrei hef ég farið í eftirpartý hjá fólki sem ég þekkti varla","Aldrei hef ég pantað leigubíl og gleymt honum","Aldrei hef ég eytt meira en 100 þúsund á einu djammi"];let game="connect",mode="sober",order=[],index=0;const $=id=>document.getElementById(id);function data(){if(game==="connect")return connect;return mode==="sober"?neverSober:neverDrink}function shuffle(){order=data().map((_,i)=>i).sort(()=>Math.random()-.5);index=0}function render(){if(!order.length)shuffle();const a=data();$("fact").textContent=a[order[index]];$("counter").textContent=`${index+1} / ${a.length}`;$("connectBtn").classList.toggle("active",game==="connect");$("neverBtn").classList.toggle("active",game==="never");$("soberBtn").classList.toggle("active",mode==="sober");$("drinkBtn").classList.toggle("active",mode==="drinks");if(game==="connect"){$("eyebrow").textContent=mode==="sober"?"STATTU UPP EF...":"STATTU UPP EF... · 18+";$("sub").textContent=mode==="sober"?"Stattu upp ef staðreyndin á við um þig.":"Þau sem tengja mega taka lítinn sopa."}else{$("eyebrow").textContent=mode==="sober"?"SETTU NIÐUR FINGUR EF...":"LÍTILL SOPI EF... · 18+";$("sub").textContent=mode==="sober"?"Haldið upp fingrum. Settu niður einn fingur ef staðhæfingin á við.":"Sopi má alltaf vera vatn eða óáfengur drykkur."}$("small").textContent=mode==="sober"?"Engin pressa. Alltaf má sitja hjá.":"Engin pressa og alltaf í lagi að sleppa. Þetta er leikur, ekki drykkjukeppni."}$("connectBtn").onclick=()=>{game="connect";shuffle();render()};$("neverBtn").onclick=()=>{game="never";shuffle();render()};$("soberBtn").onclick=()=>{mode="sober";shuffle();render()};$("drinkBtn").onclick=()=>$("gate").classList.add("show");$("gateNo").onclick=()=>$("gate").classList.remove("show");$("gateYes").onclick=()=>{mode="drinks";shuffle();$("gate").classList.remove("show");render()};$("next").onclick=()=>{index=(index+1)%order.length;render()};$("prev").onclick=()=>{index=(index-1+order.length)%order.length;render()};$("shuffle").onclick=()=>{shuffle();render()};shuffle();render();</script></body></html>

name: Sync game data from Google Docs

on:
  push:
    paths:
      - ".github/workflows/sync-google-docs.yml"
      - "scripts/sync-docs.mjs"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull public Google Docs
        run: node scripts/sync-docs.mjs

      - name: Commit updated game data
        run: |
          if git diff --quiet -- data.json && git ls-files --error-unmatch data.json >/dev/null 2>&1; then
            echo "No game-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Sync game data from Google Docs"
          git push
